name: Race Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Go Race Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go race tests
        run: go test -race ./internal/notifier ./internal/mockgenerator ./internal/mockreceiver ./internal/scheduler
