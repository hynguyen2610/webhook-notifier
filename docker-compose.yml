services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-notifier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webhook_notifier
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_notifier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
